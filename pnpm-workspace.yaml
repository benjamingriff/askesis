packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true

allowBuilds:
  '@sentry/cli': true
  # Pulled in by the mobile app; both install scripts only print a thank-you message.
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  unrs-resolver: true

overrides:
  # One React for every package: React Native 0.88 (apps/mobile) needs exactly 19.3.0, and a second
  # copy breaks shared tooling such as @testing-library/react with invalid hook calls.
  react: 19.3.0
  react-dom: 19.3.0
  undici: 7.30.1
  nanoid: 3.3.18
  source-map-js: 1.2.2
  'zod@>=4 <4.6.6': 4.6.6
  # Expo's build tooling (@expo/cli, @expo/xcpretty) pins vulnerable patch releases.
  'brace-expansion@>=4 <5.0.11': 5.0.11
  'js-yaml@>=4 <4.3.2': 4.3.2
