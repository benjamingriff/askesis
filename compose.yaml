name: askesis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askesis}
      POSTGRES_USER: ${POSTGRES_USER:-askesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askesis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-askesis} -d ${POSTGRES_DB:-askesis}']
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: askesis_test
      POSTGRES_USER: askesis_test
      POSTGRES_PASSWORD: askesis_test
    ports:
      - '127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U askesis_test -d askesis_test']
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    image: arigaio/atlas:1.2.3
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /workspace/database
    environment:
      HOME: /tmp
      DATABASE_URL: postgres://${POSTGRES_USER:-askesis}:${POSTGRES_PASSWORD:-askesis}@postgres:5432/${POSTGRES_DB:-askesis}?sslmode=disable
    volumes:
      - ./database:/workspace/database
    command: ['migrate', 'apply', '--env', 'local']
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:17-alpine
    working_dir: /workspace
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-askesis}
      PGUSER: ${POSTGRES_USER:-askesis}
      PGPASSWORD: ${POSTGRES_PASSWORD:-askesis}
    volumes:
      - ./database/seed:/workspace/database/seed:ro
    command: ['sh', '/workspace/database/seed/seed.sh']
    depends_on:
      migrate:
        condition: service_completed_successfully

  publish-fixture:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-askesis}:${POSTGRES_PASSWORD:-askesis}@postgres:5432/${POSTGRES_DB:-askesis}
      CLERK_SECRET_KEY: sk_test_fixture_operator
      CLERK_PUBLISHABLE_KEY: pk_test_fixture_operator
    command: ['node', 'apps/api/dist/development/publish-fixture.js']
    depends_on:
      seed:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      CHAT_EXECUTION_MODE: ${CHAT_EXECUTION_MODE:-unavailable}
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-askesis}:${POSTGRES_PASSWORD:-askesis}@postgres:5432/${POSTGRES_DB:-askesis}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:8080,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/ready').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      publish-fixture:
        condition: service_completed_successfully

  agent:
    profiles: ['agent']
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      AGENT_API_URL: http://api:3000
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-6.1-sol}
      AGENT_REASONING: ${AGENT_REASONING:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3000}
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
