# This file is used only with an explicit worktree-specific project name.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: askesis_bench
      POSTGRES_USER: askesis_bench
      POSTGRES_PASSWORD: askesis_bench
    ports:
      - '127.0.0.1:${BENCH_DATABASE_PORT:?}:5432'
    volumes:
      - benchmark_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U askesis_bench -d askesis_bench']
      interval: 2s
      timeout: 5s
      retries: 20
  migrate:
    image: arigaio/atlas:1.2.3
    working_dir: /workspace/database
    environment:
      DATABASE_URL: postgres://askesis_bench:askesis_bench@postgres:5432/askesis_bench?sslmode=disable
    volumes:
      - ./database:/workspace/database:ro
    command: ['migrate', 'apply', '--env', 'local']
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  benchmark_data:
