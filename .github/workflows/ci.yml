name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public build-time placeholder; this is not a Clerk secret or a usable key.
      VITE_CLERK_PUBLISHABLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lightweight validation
        run: pnpm check

  database-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL integration and invariants
        run: pnpm test:db
      - name: Populated Phase 5 migration preservation
        run: pnpm test:live:upgrade
      - name: Disposable streaming worker and public proxy smoke
        run: pnpm smoke
