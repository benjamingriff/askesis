server {
    listen 80;
    server_name _;

    # Railway private DNS may not be ready when nginx starts. Resolve the API
    # hostname when a request arrives instead of failing nginx configuration.
    resolver ${DNS_RESOLVER} valid=10s ipv6=on;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
